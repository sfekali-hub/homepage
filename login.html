<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0080ff"><title>Anmelden | sunfacemusic.com</title><style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;display:grid;place-items:center;background:#0080ff;color:#fff;font-family:Arial,sans-serif}.panel{text-align:center;padding:28px;width:min(420px,calc(100% - 32px))}.logo{display:block;width:min(280px,80%);height:100px;object-fit:contain;margin:0 auto 24px}.actions{display:grid;gap:12px}button,.link{border:1px solid #8bc5ff;border-radius:8px;background:#006dcc;color:#fff;padding:13px 18px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}button:hover,.link:hover{background:#fff;color:#0074e8}.google{background:#fff;color:#1768bd}.message{min-height:1.5em;font-size:14px;margin:14px 0 0}.message:empty{display:none}.small{font-size:13px;margin-top:20px;color:#e4f1ff}.small a{color:#fff}
</style></head><body><main class="panel"><img class="logo" src="assets/sunfacemusic-logo.png" alt="SuNfAcEmusic"><div class="actions"><button id="email">Mit E-Mail fortfahren</button><button class="google" id="google">Mit Google fortfahren</button></div><p class="message" id="message" role="status"></p></main><script src="auth-config.js"></script><script src="https://cdn.auth0.com/js/auth0-spa-js/2.28.3/auth0-spa-js.production.js"></script><script>
(async()=>{const c=window.SUNFACE_AUTH0_CONFIG,m=document.getElementById('message');let client;try{if(!window.auth0?.createAuth0Client)throw Error('Auth0 konnte nicht geladen werden.');client=await window.auth0.createAuth0Client({domain:c.domain,clientId:c.clientId,authorizationParams:{redirect_uri:c.callbackUrl,scope:'openid profile email'},cacheLocation:'memory'});}catch(e){m.textContent=e.message;return}async function go(provider){try{const authorizationParams={};if(provider)authorizationParams.connection=provider;await client.loginWithRedirect({authorizationParams,appState:{returnTo:c.homeUrl}})}catch(e){location.href='error.html?reason='+encodeURIComponent(e.message||'login_failed')}}document.getElementById('email').addEventListener('click',()=>go());document.getElementById('google').addEventListener('click',()=>go('google-oauth2'));})();
</script></body></html>
