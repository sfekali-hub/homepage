<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0080ff"><title>sunfacemusic.com</title><style>

</style></head><body style="visibility:hidden"><main class="panel"><img class="logo" src="assets/sunfacemusic-logo.png" alt="SuNfAcEmusic"><div class="actions"><h1>Willkommen</h1><a class="link" href="http://www.sunfacemusic.com/">
  <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7M5 9v12h5v-6h4v6h5V9"/></svg>
