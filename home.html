<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0080ff"><title>sunfacemusic.com</title><style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;display:grid;place-items:center;background:#0080ff;color:#fff;font-family:Arial,sans-serif}.panel{text-align:center;padding:28px;width:min(420px,calc(100% - 32px))}.logo{display:block;width:min(280px,80%);height:100px;object-fit:contain;margin:0 auto 24px}.actions{display:grid;gap:12px}button,.link{border:1px solid #8bc5ff;border-radius:8px;background:#006dcc;color:#fff;padding:13px 18px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}button:hover,.link:hover{background:#fff;color:#0074e8}.google{background:#fff;color:#1768bd}.message{min-height:1.5em;font-size:14px;margin:14px 0 0}.message:empty{display:none}.small{font-size:13px;margin-top:20px;color:#e4f1ff}.small a{color:#fff}
</style></head><body style="visibility:hidden"><main class="panel"><img class="logo" src="assets/sunfacemusic-original.jpg" alt="SuNfAcEmusic"><div class="actions"><h1>Willkommen</h1><a class="link" href="http://www.sunfacemusic.com/">Zur Startseite</a><button id="logout">Abmelden</button></div></main><script src="auth-config.js"></script><script src="https://cdn.auth0.com/js/auth0-spa-js/2.28.3/auth0-spa-js.production.js"></script><script>(async()=>{if(sessionStorage.getItem('sunface.authenticated')!=='true'){location.replace('error.html?reason=authentication_required');return}const c=window.SUNFACE_AUTH0_CONFIG,client=await window.auth0.createAuth0Client({domain:c.domain,clientId:c.clientId,authorizationParams:{redirect_uri:c.homeUrl},cacheLocation:'memory'});document.body.style.visibility='visible';document.getElementById('logout').addEventListener('click',()=>{sessionStorage.removeItem('sunface.authenticated');sessionStorage.setItem('sunface.logout','pending');client.logout({logoutParams:{returnTo:c.logoutUrl}})})})().catch(()=>location.replace('error.html?reason=authentication_required'));</script></body></html>
