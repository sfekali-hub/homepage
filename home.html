<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0080ff"><title>sunfacemusic.com</title><style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#0080ff;color:#fff;font-family:Arial,sans-serif}.panel{display:grid;grid-template-rows:minmax(min-content,1fr) auto minmax(min-content,1fr);justify-items:center;min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));text-align:center}
.logo{display:block;width:70px;max-width:100%;height:25px;object-fit:contain;align-self:start}
.panel>h1{margin:16px 0}
.actions{display:flex;flex-wrap:wrap;justify-content:center;align-self:end;gap:12px}
.actions>.link,.actions>button{display:grid;place-items:center;width:48px;height:48px;padding:0}
button,.link{border:1px solid #8bc5ff;border-radius:8px;background:#006dcc;color:#fff;padding:13px 18px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}button:hover,.link:hover{background:#fff;color:#0074e8}.google{background:#fff;color:#1768bd}.message{min-height:1.5em;font-size:14px;margin:14px 0 0}.message:empty{display:none}.small{font-size:13px;margin-top:20px;color:#e4f1ff}.small a{color:#fff}
</style></head><body style="visibility:hidden"><main class="panel"><img class="logo" src="assets/sunfacemusic-logo.png" alt="SuNfAcEmusic"><h1>Willkommen</h1><div class="actions"><a class="link" href="http://www.sunfacemusic.com/" aria-label="Zur Startseite" title="Zur Startseite">
  <svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7M5 9v12h5v-6h4v6h5V9"/></svg>
</a><button id="logout" aria-label="Abmelden" title="Abmelden">
  <svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5m5-14 5 5-5 5m-7-5h12"/></svg>
</button></div></main><script src="auth-config.js"></script><script src="https://cdn.auth0.com/js/auth0-spa-js/2.28.3/auth0-spa-js.production.js"></script><script>(async()=>{if(sessionStorage.getItem('sunface.authenticated')!=='true'){location.replace('error.html?reason=authentication_required');return}const c=window.SUNFACE_AUTH0_CONFIG,client=await window.auth0.createAuth0Client({domain:c.domain,clientId:c.clientId,authorizationParams:{redirect_uri:c.homeUrl},cacheLocation:'memory'});document.body.style.visibility='visible';document.getElementById('logout').addEventListener('click',()=>{sessionStorage.removeItem('sunface.authenticated');sessionStorage.setItem('sunface.logout','pending');client.logout({logoutParams:{returnTo:c.logoutUrl}})})})().catch(()=>location.replace('error.html?reason=authentication_required'));</script></body></html>
