async function fetchFeed(url, timeout) {
  const response = await fetch(url, {
    credentials: "omit",
    referrerPolicy: "no-referrer",
    signal: AbortSignal.timeout(timeout)
  });
  if (!response.ok) throw new Error("RSS-Abruf fehlgeschlagen");
  return response;
}

function articleLinks(items) {
  return items.flatMap(({title, link}) => {
    if (typeof title !== "string" || !title.trim() || typeof link !== "string") return [];
    const url = URL.parse(link.trim());
    if (!url || !["https:", "http:"].includes(url.protocol) || url.username || url.password) return [];
    url.protocol = "https:";
    return [{title: title.trim(), url: url.href}];
  }).slice(0, 10);
}

async function readHeadlines(feed) {
  try {
    const response = await fetchFeed(feed, 4000);
    const xml = new DOMParser().parseFromString(await response.text(), "application/xml");
    const items = Array.from(xml.querySelectorAll("channel > item"), item => ({
      title: item.querySelector("title")?.textContent,
      link: item.querySelector("link")?.textContent
    }));
    const headlines = articleLinks(items);
    if (headlines.length) return headlines;
  } catch {
    // Some publishers do not allow cross-origin browser requests.
  }

  const relay = new URL("https://api.rss2json.com/v1/api.json");
  relay.searchParams.set("rss_url", feed);
  const response = await fetchFeed(relay, 8000);
  const data = await response.json();
  if (data.status !== "ok" || !Array.isArray(data.items)) throw new Error("Ungültige RSS-Antwort");
  return articleLinks(data.items);
}

async function loadTicker(ticker) {
  const status = ticker.querySelector(".ticker-status");
  try {
    const headlines = await readHeadlines(ticker.dataset.feed);
    if (!headlines.length) throw new Error("Keine Meldungen verfügbar");

    const items = ticker.querySelector(".ticker-items");
    items.replaceChildren(...headlines.map(({title, url}) => {
      const link = document.createElement("a");
      link.href = url;
      link.textContent = title;
      return link;
    }));

    if (items.scrollWidth > items.parentElement.clientWidth) {
      items.style.setProperty("--ticker-duration", (items.scrollWidth / 34) + "s");
      ticker.classList.add("ticker-ready");
    }
  } catch {
    status.textContent = "Meldungen derzeit nicht verfügbar.";
  }
}
